name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NuGetDirectory: ${{ github.workspace }}/nuget

jobs:
  build_and_test:
    name: Build, Test, and Pack
    # macos-26 is the image that ships the Xcode 26.x toolchain the net11.0-macos workload expects (macos-latest
    # only carries Xcode 16.x). Matches the StreamWeaver native-head build.
    runs-on: macos-26

    permissions:
      contents: read
      # Signing the provenance statement for the packages this job produces. Stated explicitly
      # because attestation needs more than the read-only default.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs full history

      # Deliberately not pinned to a fixed Xcode. The macOS SDK pack states a minimum Xcode and the workload
      # manifest is installed unpinned below, so a hard pin goes stale the moment the manifest moves. The image
      # default tracks the newest installed Xcode, which is what the current manifest is built against.
      # Reported so the log names it.
      - name: Report selected Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - uses: actions/setup-dotnet@v6
        with:
          # net11.0 needs the .NET 11 preview SDK alongside .NET 10; global.json selects it.
          dotnet-version: |
            10.0.x
            11.0.x

      # The net11.0-macos TFM requires the macos workload; the preview SDK does not bundle it, so install
      # it explicitly before restore (NETSDK1147 otherwise).
      - name: Install macos workload
        run: dotnet workload install macos

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # syphon-python ships wheels for CPython 3.8 to 3.12

      # The Syphon framework as the interop tests' peer, in a process of its own.
      - name: Install syphon-python
        run: |
          python3 -m venv "$HOME/syphon-venv"
          "$HOME/syphon-venv/bin/pip" install --quiet --upgrade pip
          "$HOME/syphon-venv/bin/pip" install --quiet syphon-python numpy pyobjc-framework-Cocoa

      - name: Restore
        run: dotnet restore Syphon.NET.slnx

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: dotnet build Syphon.NET.slnx --no-restore -c Release

      - name: Test
        run: >-
          dotnet test --solution Syphon.NET.slnx --no-build -c Release
          --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Summarize coverage
        # Renders the cobertura totals into the run summary, so the numbers are on the run page itself.
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          files = sorted(glob.glob('**/coverage.cobertura.xml', recursive=True))
          if not files:
              print('### Coverage\n\nNo coverage report was produced.')
              raise SystemExit(0)

          root = ET.parse(files[0]).getroot()

          def pct(attr):
              return float(root.get(attr) or 0) * 100

          print('### Coverage\n')
          print('| Metric | Covered | Total | Rate |')
          print('| --- | ---: | ---: | ---: |')
          print(f"| Lines | {root.get('lines-covered')} | {root.get('lines-valid')} | {pct('line-rate'):.1f}% |")
          print(f"| Branches | {root.get('branches-covered')} | {root.get('branches-valid')} | {pct('branch-rate'):.1f}% |")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          if-no-files-found: warn
          path: "**/coverage.cobertura.xml"

      # IsAotCompatible only runs the analyzers. Publishing and running a real program is what proves
      # the library works as Native AOT.
      - name: Native AOT publish and run
        run: |
          dotnet publish samples/Syphon.NET.Smoke/Syphon.NET.Smoke.csproj -c Release
          app=$(find samples/Syphon.NET.Smoke/bin/Release -path '*Syphon.NET.Smoke.app/Contents/MacOS/Syphon.NET.Smoke' -type f | head -1)
          perl -e 'alarm 60; exec @ARGV' "$app"

      - name: Pack
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/Syphon.NET/Syphon.NET.csproj --no-build -c Release -o ${{ env.NuGetDirectory }}

      - name: Attest build provenance
        # Records, in a signed statement GitHub hosts, which workflow and which commit produced these
        # exact package files. Anyone who downloads the package can verify it came from this repository
        # rather than from someone who republished it under the same name.
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.NuGetDirectory }}/*.nupkg
      - name: Upload package artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.NuGetDirectory }}/*.nupkg

  publish_nuget:
    name: Publish NuGet Packages
    needs: [build_and_test]
    # Publishing runs only when a GitHub release is published (or manually dispatched), matching
    # the other Agash packages. Requires a NuGet.org trusted-publishing policy for this package.
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest # the package is platform-agnostic; no macOS needed to push it
    # Declaring an environment is what makes GitHub record a deployment, which is what
    # surfaces the Deployments tab and the package link on the repo home page.
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/Syphon.NET
    permissions:
      contents: read
      id-token: write # OIDC for NuGet.org trusted publishing

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ${{ env.NuGetDirectory }}

      - uses: actions/setup-dotnet@v6

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Agash

      - name: Publish packages
        run: |
          for f in "${{ env.NuGetDirectory }}"/*.nupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
