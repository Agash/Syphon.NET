name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published rule finds existing code without waiting for the next push.
    - cron: "31 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    # macos-26 ships the Xcode toolchain the net11.0-macos workload expects, and the native shim only
    # builds on macOS. CodeQL cannot analyse what it cannot compile, so this has to match the build job.
    runs-on: macos-26
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET SDK
        # Install both SDKs and let global.json pick: setup-dotnet resolving the pinned preview from
        # global.json alone left the runner on its preinstalled 10.0.x, which cannot target net11.0.
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      # Manual build mode: the autobuilder does not know about the pinned preview SDK or the
      # solution layout, and a build it cannot complete yields no analysis at all.
      - name: Install macos workload
        run: dotnet workload install macos

      - name: Build native shim (universal arm64 + x86_64)
        run: bash native/build-native.sh

      - name: Build solution
        run: dotnet build Syphon.NET.slnx --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
